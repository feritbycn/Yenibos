<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1c2a5a">
<link rel="icon" type="image/png" href="icon.png">
<meta name="mobile-web-app-capable" content="yes">
<title>3D Bus Puzzle Deluxe</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="menu-mode">
  <div id="stage"></div>

  <div id="hud" hidden>
    <div class="hud-top">
      <button id="btnPause" class="round-btn" aria-label="Duraklat"></button>
      <div class="lvl-pill"><b id="lvlName">SEVİYE 1</b><small id="lvlDiff"></small></div>
      <button id="hudCoins" class="coin-chip" aria-label="Mağaza"></button>
    </div>
    <div class="hud-sub">
      <div class="prog"><i id="progBar"></i><span id="progTxt"></span></div>
      <button id="chipStars" class="chip stars-chip" hidden aria-label="Hamle ve yıldız"></button>
      <button id="chipMoves" class="chip" hidden></button>
      <button id="chipTime" class="chip" hidden></button>
    </div>
    <div id="lastSlot" class="last-slot" hidden><i></i>SON PARK YERİ!</div>
    <div id="stageBanner" class="stage-banner" hidden></div>
    <div id="modeBanner" class="mode-banner" hidden></div>
    <div class="hud-bottom"><div id="powerBar" class="power-bar"></div></div>
  </div>

  <div id="menu" class="screen"></div>
  <div id="tut" hidden></div>
  <div id="modalHost"></div>
  <div id="floaters"></div>
  <div id="toasts"></div>
  <div id="loading" aria-label="Yükleniyor">
    <div class="sp-sky"><i class="cloud c1"></i><i class="cloud c2"></i><i class="cloud c3"></i><i class="sun"></i></div>
    <div class="sp-title"><b>BUS PUZZLE</b><i>DELUXE</i><small>3D</small></div>
    <div class="sp-scene">
      <div class="sp-crowd"><span style="--c:#f23a4a"></span><span style="--c:#ffc414"></span><span style="--c:#2f7bff"></span><span style="--c:#2fcf4f"></span><span style="--c:#9a4dff"></span></div>
      <div class="sp-road"><i></i></div>
      <svg class="sp-bus" viewBox="0 0 260 120" aria-hidden="true">
        <ellipse cx="130" cy="108" rx="112" ry="8" fill="rgba(0,0,0,.22)"/>
        <rect x="8" y="22" width="244" height="72" rx="20" fill="#ffc414" stroke="#c98a00" stroke-width="4"/>
        <rect x="8" y="62" width="244" height="14" fill="#e8a500"/>
        <rect x="22" y="32" width="48" height="30" rx="7" fill="#7fc4ff" stroke="#2b3b7a" stroke-width="3"/>
        <rect x="76" y="32" width="48" height="30" rx="7" fill="#7fc4ff" stroke="#2b3b7a" stroke-width="3"/>
        <rect x="130" y="32" width="48" height="30" rx="7" fill="#7fc4ff" stroke="#2b3b7a" stroke-width="3"/>
        <rect x="184" y="30" width="56" height="36" rx="9" fill="#7fc4ff" stroke="#2b3b7a" stroke-width="3"/>
        <circle cx="48" cy="48" r="9" fill="#f23a4a"/><circle cx="102" cy="48" r="9" fill="#2f7bff"/><circle cx="156" cy="48" r="9" fill="#2fcf4f"/>
        <rect x="236" y="70" width="14" height="10" rx="4" fill="#fff6c8"/>
        <g class="whl"><circle cx="64" cy="94" r="17" fill="#1a1c22"/><circle cx="64" cy="94" r="8" fill="#cfd6de"/><rect x="62" y="80" width="4" height="28" fill="#6b7480"/></g>
        <g class="whl"><circle cx="198" cy="94" r="17" fill="#1a1c22"/><circle cx="198" cy="94" r="8" fill="#cfd6de"/><rect x="196" y="80" width="4" height="28" fill="#6b7480"/></g>
      </svg>
    </div>
    <div class="sp-load"><div class="sp-bar"><i id="spBar"></i></div><b id="spTxt">Otobüsler hazırlanıyor…</b><small id="spPct">0%</small></div>
  </div>
</div>
<script type="module" src="dist/main.js"></script>
</body>
</html>
